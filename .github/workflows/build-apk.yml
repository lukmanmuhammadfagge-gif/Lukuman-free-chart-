name: Build Lukuman Free Chat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Lukuman-Free-Chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v1.${{ github.run_number }}
          name: Lukuman Free Chat APK (Build #${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
